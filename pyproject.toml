[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-postmortem-demo"
version = "0.1.0"
description = "A local SRE incident and postmortem showcase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "cursor-sdk>=1.0",
    "jinja2>=3.1",
    "psutil>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.2", "ruff>=0.6"]

[tool.setuptools]
packages = ["checkout_svc", "postmortem_agent", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
